name: sensoria
description: "SensorIA - Aplicación de reciclaje inteligente con recompensas"

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  http: ^1.2.1
  flutter_secure_storage: ^9.2.0
  provider: ^6.1.0
  image_picker: ^1.0.0
  tflite_flutter: ^0.11.0
  image: ^4.0.0
  # geolocator: ^11.0.0
  geolocator: ^10.0.0
  mobile_scanner: ^3.0.0
  fl_chart: ^0.68.0 
  url_launcher: ^6.2.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  flutter_launcher_icons: "^0.13.1"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints.
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/backgrounds/
    - assets/badges/
    - assets/mascots/
    - assets/particles/
    - assets/rewards/
    - assets/ui/
    - assets/icons/
    - assets/bins/
    - assets/models/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # To add custom fonts to your application, add a fonts section here.
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf


# ======= ESTO VA AL PURO FINAL DEL ARCHIVO, SIN ESPACIOS AL INICIO =======
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21