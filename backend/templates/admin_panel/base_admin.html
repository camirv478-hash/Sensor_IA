<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SensorIA Admin{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    {% block head_extra %}{% endblock %}

    <style>
        :root{
            --bg:#07110B;
            --bg-card:#13241A;
            --bg-card-hover:#183123;
            --accent:#6CFF8F;
            --accent-2:#00BCD4;
            --text:#FFFFFF;
            --muted:#8FA497;
            --border:rgba(255,255,255,.08);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--bg);
            color:var(--text);
            font-family:'Segoe UI',sans-serif;
            overflow-x:hidden;
        }

        body::before{
            content:"";
            position:fixed;
            width:500px;
            height:500px;
            top:-200px;
            right:-150px;
            background:rgba(108,255,143,.08);
            filter:blur(120px);
            z-index:-1;
        }

        body::after{
            content:"";
            position:fixed;
            width:400px;
            height:400px;
            bottom:-180px;
            left:-120px;
            background:rgba(0,188,212,.08);
            filter:blur(120px);
            z-index:-1;
        }

        .sidebar{
            width:280px;
            min-height:100vh;
            position:fixed;
            top:0;
            left:0;
            background:linear-gradient(
                180deg,
                #0D1B13,
                #07110B
            );
            padding:30px;
            border-right:1px solid var(--border);
        }

        .logo{
            color:var(--accent);
            font-size:34px;
            font-weight:700;
            margin-bottom:40px;
            text-align:center;
        }

        .menu-item{
            display:flex;
            align-items:center;
            gap:14px;
            padding:15px 18px;
            border-radius:18px;
            margin-bottom:10px;
            text-decoration:none;
            color:#B9C5BC;
            transition:.25s;
        }

        .menu-item:hover{
            background:#13241A;
            color:white;
            transform:translateX(4px);
        }

        .menu-item i{
            width:22px;
        }

        .content{
            margin-left:280px;
            padding:35px;
        }

        .page-title{
            font-size:34px;
            font-weight:700;
        }

        .page-subtitle{
            color:var(--muted);
            margin-top:4px;
        }

        .card-panel{
            background:var(--bg-card);
            border-radius:24px;
            padding:24px;
            border:1px solid var(--border);
            backdrop-filter:blur(10px);
        }

        .card-sensoria{
            background:linear-gradient(
                145deg,
                #13241A,
                #102017
            );
            border-radius:24px;
            padding:24px;
            border:1px solid var(--border);
            transition:.25s;
            height:100%;
        }

        .card-sensoria:hover{
            transform:translateY(-4px);
            background:var(--bg-card-hover);
        }

        .card-icon{
            width:60px;
            height:60px;
            border-radius:18px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(108,255,143,.12);
            color:var(--accent);
            font-size:24px;
            margin-bottom:18px;
        }

        .card-title{
            color:var(--muted);
            font-size:.95rem;
            margin-bottom:8px;
        }

        .card-value{
            font-size:2rem;
            font-weight:700;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .dashboard-title{
            font-size:38px;
            font-weight:700;
        }

        .dashboard-subtitle{
            color:var(--muted);
        }

        .chart-card,
        .activity-card{
            background:var(--bg-card);
            border-radius:24px;
            padding:24px;
            border:1px solid var(--border);
            height:100%;
        }

        .activity-item{
            display:flex;
            gap:14px;
            align-items:center;
            margin-bottom:18px;
        }

        .activity-icon{
            width:48px;
            height:48px;
            border-radius:14px;
            background:rgba(108,255,143,.12);
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--accent);
        }

        .progress{
            background:#1A2B22;
            height:12px;
            border-radius:30px;
            overflow:hidden;
        }

        .progress-bar{
            background:linear-gradient(
                90deg,
                var(--accent),
                var(--accent-2)
            );
            font-size:.7rem;
            color:#07110B;
            font-weight:700;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .table{
            color:white;
            --bs-table-bg:transparent;
        }

        .table thead th{
            color:#A5B8AA;
            border-color:rgba(255,255,255,.08);
        }

        .table tbody td{
            border-color:rgba(255,255,255,.04);
        }

        .form-control,
        .form-select{
            background:#0F1B16;
            border:1px solid rgba(255,255,255,.12);
            color:white;
        }

        .form-control:focus,
        .form-select:focus{
            background:#13241A;
            border-color:var(--accent);
            color:white;
            box-shadow:none;
        }

        .btn-success{
            background:var(--accent);
            color:#07110B;
            border:none;
            font-weight:600;
        }

        .btn-success:hover{
            background:#58f57f;
            color:#07110B;
        }

        .text-muted-light{
            color:var(--muted);
        }

        @media(max-width:992px){

            .sidebar{
                width:100%;
                position:relative;
                min-height:auto;
            }

            .content{
                margin-left:0;
            }

            .topbar{
                flex-direction:column;
                align-items:flex-start;
                gap:20px;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        🌱 SensorIA
    </div>

    <a href="{% url 'admin_dashboard' %}" class="menu-item">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>

    <a href="{% url 'admin_user_list' %}" class="menu-item">
        <i class="fa-solid fa-users"></i>
        Usuarios
    </a>

    <a href="{% url 'admin_recycling' %}" class="menu-item">
        <i class="fa-solid fa-recycle"></i>
        Reciclajes
    </a>

    <a href="{% url 'admin_bin_list' %}" class="menu-item">
        <i class="fa-solid fa-trash"></i>
        Contenedores
    </a>

    <a href="{% url 'admin_gemini' %}" class="menu-item">
        <i class="fa-solid fa-robot"></i>
        IA Gemini
    </a>

    <a href="{% url 'admin_marketplace' %}" class="menu-item">
        <i class="fa-solid fa-store"></i>
        Marketplace
    </a>

</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}

</body>
</html>
