<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IA Gemini - SensorIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#07110B; color:white; font-family:'Segoe UI',sans-serif; }
        .sidebar{ width:270px; min-height:100vh; position:fixed; background:linear-gradient(180deg, #0D1B13, #07110B); padding:30px; border-right:1px solid rgba(255,255,255,.05); }
        .logo{ color:#6CFF8F; font-size:32px; font-weight:bold; margin-bottom:40px; }
        .menu-item{ padding:16px 18px; border-radius:18px; margin-bottom:12px; transition:.3s; cursor:pointer; color:#B9C5BC; display:flex; align-items:center; }
        .menu-item:hover{ background:#13241A; color:white; transform:translateX(5px); }
        .menu-item i{ margin-right:12px; }
        .content{ margin-left:270px; padding:35px; }
        .page-title{ font-size:32px; font-weight:bold; margin-bottom:8px; }
        .page-subtitle{ color:#8FA497; margin-bottom:24px; }
        .card-panel{ background:#13241A; border-radius:24px; border:1px solid rgba(108,255,143,.08); padding:24px; }
        .text-muted-light{ color:#8FA497; }
        @media(max-width:992px){ .sidebar{ position:relative; width:100%; min-height:auto; } .content{ margin-left:0; } }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">🌱 SensorIA</div>
    <a href="{% url 'admin_dashboard' %}" class="menu-item"><i class="fa-solid fa-chart-line"></i>Dashboard</a>
    <a href="{% url 'admin_user_list' %}" class="menu-item"><i class="fa-solid fa-users"></i>Usuarios</a>
    <a href="{% url 'admin_recycling' %}" class="menu-item"><i class="fa-solid fa-recycle"></i>Reciclajes</a>
    <a href="{% url 'admin_bin_list' %}" class="menu-item"><i class="fa-solid fa-trash"></i>Contenedores</a>
    <a href="{% url 'admin_gemini' %}" class="menu-item"><i class="fa-solid fa-robot"></i>IA Gemini</a>
    <a href="{% url 'admin_marketplace' %}" class="menu-item"><i class="fa-solid fa-store"></i>Marketplace</a>
</div>

<div class="content">
    <div class="page-title">IA Gemini</div>
    <div class="page-subtitle">Estado y control del asistente de IA.</div>
    <div class="card-panel mt-4">
        <p class="text-muted-light">Esta página es un marcador de posición del módulo IA Gemini. Aquí puedes mostrar estado de conexión, configuración de modelo y métricas de respuestas.</p>
    </div>
</div>
</body>
</html>
